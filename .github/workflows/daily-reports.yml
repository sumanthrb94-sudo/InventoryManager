name: Daily inventory & sales reports

on:
  schedule:
    # 23:30 UTC (11:30 PM GMT) every day. GitHub may start scheduled runs late under load.
    - cron: '30 23 * * *'
  workflow_dispatch:

concurrency:
  group: daily-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/daily_reports/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/daily_reports/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve dates
        id: d
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "pretty=$(date -u '+%d %b %Y')" >> "$GITHUB_OUTPUT"

      - name: Write Drive service-account key
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          printf '%s' "$GDRIVE_SA_JSON" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"

      - name: Download both reports
        env:
          IM_BASE_URL: ${{ vars.IM_BASE_URL || 'https://inventory-manager-peach-alpha.vercel.app/' }}
          IM_EMAIL: ${{ secrets.IM_EMAIL }}
          IM_PASSWORD: ${{ secrets.IM_PASSWORD }}
          OUT_DIR: out
        run: python scripts/daily_reports/fetch_reports.py "${{ steps.d.outputs.date }}"

      - name: Upload to Drive and email
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SA_FILE: ${{ runner.temp }}/sa.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python scripts/daily_reports/deliver.py \
            "out/Inventory-Report-All-Time-${{ steps.d.outputs.date }}.xlsx" \
            "out/Sales-Report-All-Time-${{ steps.d.outputs.date }}.xlsx" \
            "${{ steps.d.outputs.pretty }}"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: out/
          retention-days: 5

      - name: Shred key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
