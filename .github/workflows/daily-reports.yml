name: Daily inventory & sales reports

on:
  schedule:
    # 23:59 UTC (11:59 PM GMT) daily. GitHub often starts scheduled runs late
    # near the top of the hour — expect drift of several minutes.
    - cron: '59 23 * * *'
  workflow_dispatch:

concurrency:
  group: daily-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/daily_reports/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/daily_reports/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve dates
        id: d
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "pretty=$(date -u '+%d %b %Y')" >> "$GITHUB_OUTPUT"

      - name: Download both reports
        env:
          IM_BASE_URL: ${{ vars.IM_BASE_URL || 'https://inventory-manager-peach-alpha.vercel.app/' }}
          IM_EMAIL: ${{ secrets.IM_EMAIL }}
          IM_PASSWORD: ${{ secrets.IM_PASSWORD }}
          OUT_DIR: out
        run: python scripts/daily_reports/fetch_reports.py "${{ steps.d.outputs.date }}"

      - name: Email the reports
        working-directory: scripts/daily_reports
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python deliver.py \
            "$GITHUB_WORKSPACE/out/Inventory-Report-All-Time-${{ steps.d.outputs.date }}.xlsx" \
            "$GITHUB_WORKSPACE/out/Sales-Report-All-Time-${{ steps.d.outputs.date }}.xlsx" \
            "${{ steps.d.outputs.pretty }}"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: out/
          retention-days: 5
