name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an older run on the same ref when a new commit lands —
# saves minutes and stops two builds racing to update the PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        # ci is faster + reproducible from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: Type-check (lint script in this repo runs `tsc --noEmit`)
        run: npm run lint

      - name: Unit + integration tests
        # vitest run is the same gate the prod-readiness pack relies on
        run: npm test

      - name: Production build smoke
        # Catches build-time regressions (chunk size, transform errors,
        # missing env vars) before the Vercel preview deploy runs.
        run: npm run build
